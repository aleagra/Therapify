document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

                   <span style=\"font:600 14px 'Plus Jakarta Sans';color:#16222c\">4 / 5<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin:0 0 7px\">\n                    <span style=\"font:600 12.5px 'Plus Jakarta Sans';color:#384857\">Comentario<\u002Fspan>\n                    <span style=\"font:400 12px 'Plus Jakarta Sans';color:#8496a9\">0 / mín. 8<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"min-height:96px;border:1px solid #d2dbe5;border-radius:8px;background:#fff;padding:11px 12px;font:400 14px/1.6 'Plus Jakarta Sans';color:#8496a9;margin:0 0 14px\">Contá cómo fue la atención, el trato recibido y tu experiencia en la sesión…<\u002Fdiv>\n                  <button style=\"width:100%;height:42px;border:0;border-radius:8px;background:#eaeff5;color:#b3c0cf;font:700 14px 'Plus Jakarta Sans'\">Publicar reseña<\u002Fbutton>\n                  <p style=\"margin:10px 0 0;font:400 12px/1.5 'Plus Jakarta Sans';color:#8496a9\">Se publica con tu nombre y la fecha de la sesión.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:96px 1fr;margin-top:36px\">\n            <div style=\"border-right:1px solid #dfe6ee;padding:4px 16px 0 0;text-align:right\">\n              <div style=\"font:700 10.5px/1.4 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9\">Vacío<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding-left:28px;display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:start\">\n              <div>\n                <div style=\"display:grid;grid-template-columns:180px 1fr;padding:0 0 22px;border-bottom:1px solid #dfe6ee\">\n                  <div style=\"border-right:1px solid #dfe6ee;padding-right:20px;text-align:right\">\n                    <div style=\"font:800 52px/1 'Plus Jakarta Sans';letter-spacing:-.03em;color:#cbd6e2\">—<\u002Fdiv>\n                    <div style=\"font:400 16px/1 'Plus Jakarta Sans';color:#cbd6e2;letter-spacing:2px;margin:8px 0 6px\">★★★★★<\u002Fdiv>\n                    <div style=\"font:400 13px/1.4 'Plus Jakarta Sans';color:#8496a9\">Sin valoraciones<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"padding-left:24px;display:flex;flex-direction:column;justify-content:center\">\n                    <div style=\"font:600 16px/1.4 'Plus Jakarta Sans';color:#16222c;margin:0 0 6px\">Todavía no hay reseñas de este profesional<\u002Fdiv>\n                    <p style=\"margin:0;font:400 14px/1.6 'Plus Jakarta Sans';color:#647587;max-width:52ch\">Si ya tuviste una sesión con Nicolas, tu reseña va a ser la primera y ayuda a que otras personas se decidan.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <p style=\"margin:16px 0 0;font:400 12.5px/1.55 'Plus Jakarta Sans';color:#8496a9;max-width:68ch\">En vacío el promedio no se convierte en una caja punteada: se mantiene la misma estructura de margen + cuerpo, sólo cambia el contenido. Así la pantalla no se reorganiza cuando llega la primera reseña.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"border:1px dashed #cbd6e2;border-radius:12px;padding:20px 18px;background:#fafcfd;font:400 13px/1.6 'Plus Jakarta Sans';color:#647587\">El formulario no cambia en el estado vacío: es la acción disponible, y en esta pantalla es lo único que puede pasar.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 3d AUTH -->\n    <div id=\"3d\" style=\"display:flex;flex-direction:column;gap:9px;flex:none\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'Plus Jakarta Sans';color:rgba(22,34,44,.55)\"><a href=\"#3d\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rg ;gap:8px;margin-top:12px\">\n                    <button style=\"flex:1;height:36px;border:1px solid #cbd6e2;border-radius:8px;background:#fff;color:#253340;font:600 13px 'Plus Jakarta Sans'\">Ver detalle<\u002Fbutton>\n                    <button style=\"flex:1;height:36px;border:1px solid #cbd6e2;border-radius:8px;background:#fff;color:#253340;font:600 13px 'Plus Jakarta Sans'\">Dejar reseña<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:14px 0 0;font:400 12px/1.55 'Plus Jakarta Sans';color:#8496a9\">En mobile el margen baja a 56px y las dos acciones pasan a ocupar el ancho completo de la fila: nunca por debajo de 44px de alto.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 3h REGLAS -->\n    <div id=\"3h\" style=\"display:flex;flex-direction:column;gap:9px;flex:none\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'Plus Jakarta Sans';color:rgba(22,34,44,.55)\"><a href=\"#3h\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(22,34,44,.08);color:#16222c;border-radius:5px\">3h<\u002Fa>Hoja de reglas para implementar<\u002Fdiv>\n      <div style=\"width:1120px;background:#fff;border:1px solid rgba(22,34,44,.1);border-radius:8px;overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:96px 1fr\">\n          <div style=\"border-right:1px solid #dfe6ee;padding:32px 16px 0 0;text-align:right\">\n            <div style=\"font:700 10.5px/1.4 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9\">Reglas<\u002Fdiv>\n            <div style=\"font:600 10.5px/1.4 ui-monospace,Menlo,monospace;color:#c3cedb;margin-top:2px\">∞<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:32px 32px 36px 28px\">\n            <h2 style=\"margin:0 0 4px;font:700 26px/1.2 'Plus Jakarta Sans';letter-spacing:-.015em;color:#16222c\">Cómo decidir en una pantalla nueva<\u002Fh2>\n            <p style=\"margin:0 0 28px;font:400 14px/1.6 'Plus Jakarta Sans';color:#647587;max-width:70ch\">Tres preguntas en orden: ¿qué superficie?, ¿qué régimen de densidad?, ¿dónde cae el margen de ficha? Si las tres tienen respuesta, la pantalla ya es parte del sistema.<\u002Fp>\n\n            <div style=\"font:700 10.5px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9;margin:0 0 12px\">1 · Superficie<\u002Fdiv>\n            <div style=\"border-top:2px solid #16222c;margin:0 0 30px\">\n              <div style=\"display:grid;grid-template-columns:120px 1fr 240px;gap:20px;padding:11px 0;border-bottom:1px solid #dfe6ee;font:700 11px/1 'Plus Jakarta Sans';letter-spacing:.09em;text-transform:uppercase;color:#8496a9\"><span>Nivel<\u002Fspan><span>Se usa cuando<\u002Fspan><span>Valores<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:120px 1fr 240px;gap:20px;padding:13px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.55 'Plus Jakarta Sans';color:#647587\"><span style=\"font-weight:600;color:#16222c\">0 · Fondo<\u002Fspan><span>Lienzo de la página. Nunca contiene contenido suelto salvo el encabezado.<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px\">#f4f7fa<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:120px 1fr 240px;gap:20px;padding:13px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.55 'Plus Jakarta Sans';color:#647587\"><span style=\"font-weight:600;color:#16222c\">1 · Card<\u002Fspan><span>Un objeto accionable y contable: un profesional, el panel de reserva, la identidad del usuario, una sección de lista.<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px\">#fff · 1px #dfe6ee · r12<br>0 1px 2px rgba(13,35,55,.05)<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:120px 1fr 240px;gap:20px;padding:13px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.55 'Plus Jakarta Sans';color:#647587\"><span style=\"font-weight:600;color:#16222c\">2 · Hundida<\u002Fspan><span>Insumo o soporte: barra de filtros, resumen de reserva, horarios habituales, contenedor de la lista de días.<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px\">#eaeff5 · r10 · sin borde<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:120px 1fr 240px;gap:20px;padding:13px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.55 'Plus Jakarta Sans';color:#647587\"><span style=\"font-weight:600;color:#16222c\">3 · Lista<\u002Fspan><span>Repetición homogénea: reseñas, sesiones, días de agenda, horarios. Plano + divisor.<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px\">divisor 1px #eaeff5<br>#dfe6ee sobre fondo<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:120px 1fr;gap:20px;padding:13px 0;font:400 13.5px/1.55 'Plus Jakarta Sans';color:#647587\"><span style=\"font-weight:600;color:#c9483f\">Nunca<\u002Fspan><span>Dos cards anidadas; una card para algo que no se puede accionar; más de una card con sombra md por pantalla (esa es la acción principal).<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font:700 10.5px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9;margin:0 0 12px\">2 · Densidad<\u002Fdiv>\n            <div style=\"border-top:2px solid #16222c;margin:0 0 30px\">\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:11px 0;border-bottom:1px solid #dfe6ee;font:700 11px/1 'Plus Jakarta Sans';letter-spacing:.09em;text-transform:uppercase;color:#8496a9\"><span>Medida<\u002Fspan><span>Lectura<\u002Fspan><span>Trabajo<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:11px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.5 'Plus Jakarta Sans';color:#647587\"><span style=\"color:#384857\">Rutas<\u002Fspan><span>home · about-us · auth · 404<\u002Fspan><span>doctors · doctor/:id · appointments · profile · profile-doctor · reviews<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:11px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.5 ui-monospace,Menlo,monospace;color:#647587\"><span style=\"font-family:'Plus Jakarta Sans';color:#384857\">Padding de card<\u002Fspan><span>32<\u002Fspan><span>16<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:11px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.5 ui-monospace,Menlo,monospace;color:#647587\"><span style=\"font-family:'Plus Jakarta Sans';color:#384857\">Gap entre bloques<\u002Fspan><span>24 – 32<\u002Fspan><span>12 – 16<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:11px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.5 ui-monospace,Menlo,monospace;color:#647587\"><span style=\"font-family:'Plus Jakarta Sans';color:#384857\">Alto de control<\u002Fspan><span>44 – 48<\u002Fspan><span>36 – 40<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:11px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.5 ui-monospace,Menlo,monospace;color:#647587\"><span style=\"font-family:'Plus Jakarta Sans';color:#384857\">Cuerpo<\u002Fspan><span>15 / 1.6<\u002Fspan><span>13.5 / 1.55<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:11px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.5 ui-monospace,Menlo,monospace;color:#647587\"><span style=\"font-family:'Plus Jakarta Sans';color:#384857\">Medida de línea<\u002Fspan><span>56 – 68ch<\u002Fspan><span>48 – 54ch<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:11px 0;font:400 13.5px/1.5 ui-monospace,Menlo,monospace;color:#647587\"><span style=\"font-family:'Plus Jakarta Sans';color:#384857\">Título de página<\u002Fspan><span>44 – 52<\u002Fspan><span>32<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font:700 10.5px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9;margin:0 0 12px\">3 · Margen de ficha<\u002Fdiv>\n            <div style=\"border-top:2px solid #16222c;margin:0 0 30px\">\n              <div style=\"display:grid;grid-template-columns:150px 90px 1fr;gap:20px;padding:11px 0;border-bottom:1px solid #dfe6ee;font:700 11px/1 'Plus Jakarta Sans';letter-spacing:.09em;text-transform:uppercase;color:#8496a9\"><span>Contexto<\u002Fspan><span>Ancho<\u002Fspan><span>Qué va en el margen<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:150px 90px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.5 'Plus Jakarta Sans';color:#647587\"><span style=\"font-weight:600;color:#16222c\">Encabezado de página<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">96px<\u002Fspan><span>Kicker en versalitas + número de ruta, alineados a la derecha contra la regla.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:150px 90px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.5 'Plus Jakarta Sans';color:#647587\"><span style=\"font-weight:600;color:#16222c\">Encabezado de sección<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">96px<\u002Fspan><span>Rol o conteo (“Paciente · 3”). El cuerpo alinea con el de la página.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:150px 90px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.5 'Plus Jakarta Sans';color:#647587\"><span style=\"font-weight:600;color:#16222c\">Card de objeto<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">64px<\u002Fspan><span>Avatar de iniciales centrado + punto de disponibilidad debajo.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:150px 90px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.5 'Plus Jakarta Sans';color:#647587\"><span style=\"font-weight:600;color:#16222c\">Fila de lista<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">96px<\u002Fspan><span>Fecha (día 22px + mes en versalitas + hora) o avatar + fecha en reseñas.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:150px 90px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.5 'Plus Jakarta Sans';color:#647587\"><span style=\"font-weight:600;color:#16222c\">Bloque de promedio<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">180px<\u002Fspan><span>El número grande, las estrellas y el conteo. Es la excepción ancha.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:150px 90px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid #eaeff5;font:400 13.5px/1.5 'Plus Jakarta Sans';color:#647587\"><span style=\"font-weight:600;color:#16222c\">Wizard (register)<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">76px<\u002Fspan><span>Los pasos, uno debajo del otro: 01 / 02 / 03, con ✓ teal al completarse.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:150px 90px 1fr;gap:20px;padding:12px 0;font:400 13.5px/1.5 'Plus Jakarta Sans';color:#647587\"><span style=\"font-weight:600;color:#16222c\">Mobile<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px\">44 – 56px<\u002Fspan><span>Sólo un dato: inicial, fecha o kicker corto. Nunca desaparece.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n              <div style=\"background:#eaeff5;border-radius:10px;padding:16px 18px\">\n                <div style=\"font:700 10.5px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9;margin:0 0 10px\">Color, en una línea<\u002Fdiv>\n                <div style=\"font:400 13.5px/1.85 'Plus Jakarta Sans';color:#384857\">\n                  Azul <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px\">#0b5d8e<\u002Fspan> = acción y foco.<br>\n                  Teal <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px\">#15b096<\u002Fspan> = disponible, verificado, confirmado.<br>\n                  Coral <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px\">#c9483f<\u002Fspan> = destructivo y error, nada más.<br>\n                  Títulos en tinta <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px\">#16222c<\u002Fspan>, con una sola palabra en azul.<br>\n                  Estrellas en tinta: no son un cuarto color.\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#eaeff5;border-radius:10px;padding:16px 18px\">\n                <div style=\"font:700 10.5px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9;margin:0 0 10px\">Tres reglas que no se negocian<\u002Fdiv>\n                <div style=\"font:400 13.5px/1.85 'Plus Jakarta Sans';color:#384857\">\n                  Un solo botón primario por vista.<br>\n                  Activar un control promueve superficie, no inserta layout.<br>\n                  La regla del margen es siempre 1px neutro, nunca de color.\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <p style=\"margin:26px 0 0;font:400 12px/1.5 'Plus Jakarta Sans';color:rgba(22,34,44,.5)\">Seguimos con: “ajustá <a href=\"#3a\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:2px 6px;background:rgba(22,34,44,.08);color:#16222c;border-radius:4px\">3a<\u002Fa> para 7 días” · “mostrame los estados de error de auth” · “pasá <code style=\"font:600 11px ui-monospace,Menlo,monospace\">/reviews<\u002Fcode> a mobile”<\u002Fp>\n<\u002Fsection>\n\n<section id=\"t2\" style=\"padding:44px 48px 40px;border-bottom:1px solid rgba(22,34,44,.1)\">\n  <div style=\"display:flex;align-items:baseline;gap:10px;margin:0 0 6px\">\n    <a href=\"#t2\" style=\"font:600 10px ui-monospace,Menlo,monospace;padding:4px 8px;background:#16222c;color:#fff;border-radius:4px;text-decoration:none\">2<\u002Fa>\n    <span style=\"font:600 13px/1.2 'Plus Jakarta Sans';color:#16222c\">Ajustes en <code style=\"font:600 12px ui-monospace,Menlo,monospace\">/doctors<\u002Fcode>, flujo de reserva y <code style=\"font:600 12px ui-monospace,Menlo,monospace\">/appointments<\u002Fcode><\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 26px;font:400 12.5px/1.5 'Plus Jakarta Sans';color:rgba(22,34,44,.55);max-width:70ch\">La fila incompleta y la card sin datos opcionales en <a href=\"#2a\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:2px 6px;background:rgba(22,34,44,.08);color:#16222c;border-radius:4px\">2a<\u002Fa>. El sistema de superficies puesto a prueba en <a href=\"#2b\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:2px 6px;background:rgba(22,34,44,.08);color:#16222c;border-radius:4px\">2b<\u002Fa>.<\u002Fp>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start\">\n\n    <!-- 2a AJUSTES -->\n    <div id=\"2a\" style=\"display:flex;flex-direction:column;gap:9px;flex:none\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'Plus Jakarta Sans';color:rgba(22,34,44,.55)\"><a href=\"#2a\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(22,34,44,.08);color:#16222c;border-radius:5px\">2a<\u002Fa>Fila incompleta y card con datos mínimos<\u002Fdiv>\n      <div style=\"width:1200px;background:#fff;border:1px solid rgba(22,34,44,.1);border-radius:8px;overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:96px 1fr\">\n          <div style=\"border-right:1px solid #dfe6ee;padding:32px 16px 0 0;text-align:right\">\n            <div style=\"font:700 10.5px/1.4 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9\">Ajuste<\u002Fdiv>\n            <div style=\"font:600 10.5px/1.4 ui-monospace,Menlo,monospace;color:#c3cedb;margin-top:2px\">04<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:32px 32px 36px 28px\">\n            <h2 style=\"margin:0 0 4px;font:700 24px/1.25 'Plus Jakarta Sans';letter-spacing:-.01em;color:#16222c\">La última fila se reparte<\u002Fh2>\n            <p style=\"margin:0 0 22px;font:400 14px/1.6 'Plus Jakarta Sans';color:#647587;max-width:68ch\">La grilla deja de ser de tres columnas fijas y pasa a ser una fila elástica: <code style=\"font:600 12.5px ui-monospace,Menlo,monospace;color:#384857\">flex-wrap<\u002Fcode> con base de 330px. Con 5 resultados la segunda fila reparte el ancho entre dos cards en vez de dejar un hueco; con 4 quedan dos y dos. La card tolera el ancho extra porque el margen de ficha es fijo y sólo crece el cuerpo.<\u002Fp>\n\n            <div style=\"display:flex;flex-wrap:wrap;gap:14px;margin:0 0 30px\">\n              <sc-for list=\"{{ doctors }}\" as=\"d\" hint-placeholder-count=\"5\">\n                <div style=\"flex:1 1 330px;min-width:330px;background:#fff;border:1px solid #dfe6ee;border-radius:12px;box-shadow:0 1px 2px rgba(13,35,55,.05);overflow:hidden\">\n                  <div style=\"display:grid;grid-template-columns:64px 1fr\">\n                    <div style=\"border-right:1px solid #eaeff5;padding:16px 0;display:flex;f 0 0 4px;font:700 24px/1.25 'Plus Jakarta Sans';letter-spacing:-.01em;color:#16222c\">Cuatro superficies, sin color<\u002Fh2>\n            <p style=\"margin:0 0 26px;font:400 14px/1.6 'Plus Jakarta Sans';color:#647587;max-width:66ch\">Regla única: <strong style=\"color:#384857;font-weight:600\">una card por objeto accionable<\u002Fstrong>. El contexto va en superficie hundida y la repetición va en lista con divisor. Si todo es card, nada es card.<\u002Fp>\n\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:0 0 32px\">\n              <div style=\"background:#f4f7fa;border-radius:10px;padding:16px;min-height:172px;display:flex;flex-direction:column\">\n                <div style=\"font:700 10.5px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9\">Nivel 0<\u002Fdiv>\n                <div style=\"font:600 15px/1.4 'Plus Jakarta Sans';color:#16222c;margin:8px 0 6px\">Fondo<\u002Fdiv>\n                <div style=\"font:400 12.5px/1.55 'Plus Jakarta Sans';color:#647587;flex:1\">#f4f7fa. El lienzo de toda la app. Nunca lleva contenido directo salvo el título de página.<\u002Fdiv>\n                <div style=\"font:400 11px/1.4 ui-monospace,Menlo,monospace;color:#b3c0cf\">sin borde · sin sombra<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #dfe6ee;border-radius:10px;padding:16px;min-height:172px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(13,35,55,.05)\">\n                <div style=\"font:700 10.5px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#0b5d8e\">Nivel 1<\u002Fdiv>\n                <div style=\"font:600 15px/1.4 'Plus Jakarta Sans';color:#16222c;margin:8px 0 6px\">Card<\u002Fdiv>\n                <div style=\"font:400 12.5px/1.55 'Plus Jakarta Sans';color:#647587;flex:1\">Solo objetos accionables y contables: un profesional, una sesión, el panel de reserva. Tiene borde, radio 12 y sombra xs.<\u002Fdiv>\n                <div style=\"font:400 11px/1.4 ui-monospace,Menlo,monospace;color:#b3c0cf\">1px #dfe6ee · r12 · xs<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#eaeff5;border-radius:10px;padding:16px;min-height:172px;display:flex;flex-direction:column\">\n                <div style=\"font:700 10.5px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9\">Nivel 2<\u002Fdiv>\n                <div style=\"font:600 15px/1.4 'Plus Jakarta Sans';color:#16222c;margin:8px 0 6px\">Hundida<\u002Fdiv>\n                <div style=\"font:400 12.5px/1.55 'Plus Jakarta Sans';color:#647587;flex:1\">Soporte e insumos: barra de filtros, resumen de reserva, horarios habituales. Sin borde: se hunde, no compite.<\u002Fdiv>\n                <div style=\"font:400 11px/1.4 ui-monospace,Menlo,monospace;color:#b3c0cf\">#eaeff5 · r10 · sin borde<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border-radius:10px;padding:16px;min-height:172px;display:flex;flex-direction:column;border:1px dashed #dfe6ee\">\n                <div style=\"font:700 10.5px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9\">Nivel 3<\u002Fdiv>\n                <div style=\"font:600 15px/1.4 'Plus Jakarta Sans';color:#16222c;margin:8px 0 6px\">Lista<\u002Fdiv>\n                <div style=\"font:400 12.5px/1.55 'Plus Jakarta Sans';color:#647587;flex:1\">Plano + divisor de 1px. Para repetición homogénea: reseñas, días de agenda, horarios. Cero cajas anidadas.<\u002Fdiv>\n                <div style=\"font:400 11px/1.4 ui-monospace,Menlo,monospace;color:#b3c0cf\">divisor #eaeff5<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"height:1px;background:#dfe6ee;margin:0 0 28px\"><\u002Fdiv>\n\n            <h3 style=\"margin:0 0 4px;font:700 18px/1.3 'Plus Jakarta Sans';color:#16222c\">Densidad: lectura vs. trabajo<\u002Fh3>\n            <p style=\"margin:0 0 20px;font:400 14px/1.6 'Plus Jakarta Sans';color:#647587;max-width:66ch\">Dos regímenes. Lectura para páginas donde el usuario se orienta (home, sobre nosotros, auth). Trabajo para páginas donde decide y compara (doctors, reserva, turnos, agenda).<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n              <div style=\"border:1px solid #dfe6ee;border-radius:10px;overflow:hidden\">\n                <div style=\"padding:12px 16px;background:#f4f7fa;border-bottom:1px solid #dfe6ee;display:flex;justify-content:space-between;align-items:center\">\n                  <span style=\"font:700 11px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#384857\">Lectura<\u002Fspan>\n                  <span style=\"font:400 11.5px/1 ui-monospace,Menlo,monospace;color:#8496a9\">home · about · auth · 404<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding:18px 20px;font:400 13px/2 ui-monospace,Menlo,monospace;color:#647587\">\n                  padding card &nbsp;<span style=\"color:#16222c\">32<\u002Fspan><br>\n                  gap entre bloques &nbsp;<span style=\"color:#16222c\">24–32<\u002Fspan><br>\n                  alto de control &nbsp;<span style=\"color:#16222c\">44<\u002Fspan><br>\n                  medida de línea &nbsp;<span style=\"color:#16222c\">62–68ch<\u002Fspan><br>\n                  cuerpo &nbsp;<span style=\"color:#16222c\">15 / 1.6<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid #dfe6ee;border-radius:10px;overflow:hidden\">\n                <div style=\"padding:12px 16px;background:#eff6fb;border-bottom:1px solid #dfe6ee;display:flex;justify-content:space-between;align-items:center\">\n                  <span style=\"font:700 11px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#0b5d8e\">Trabajo<\u002Fspan>\n                  <span style=\"font:400 11.5px/1 ui-monospace,Menlo 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#85b5d5;margin:0 0 14px\">Proyecto<\u002Fdiv>\n              <p style=\"margin:0 0 14px;font:400 13.5px/1.6 'Plus Jakarta Sans';color:#dceaf4\">Desarrollado por <strong style=\"font-weight:700;color:#fff\">Alejandro Agra<\u002Fstrong> y <strong style=\"font-weight:700;color:#fff\">Bruno Costales<\u002Fstrong><\u002Fp>\n              <button style=\"height:38px;padding:0 14px;border:1px solid #1e72a3;border-radius:8px;background:transparent;color:#fff;font:600 13.5px 'Plus Jakarta Sans';cursor:pointer\">Ver repositorio en GitHub<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1e NOTA + MOBILE -->\n    <div id=\"1e\" style=\"display:flex;flex-direction:column;gap:9px;flex:none\">\n      <div style=\"display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'Plus Jakarta Sans';color:rgba(22,34,44,.55)\"><a href=\"#1e\" style=\"font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(22,34,44,.08);color:#16222c;border-radius:5px\">1e<\u002Fa>El gesto propio + <code style=\"font:600 11px ui-monospace,Menlo,monospace\">/doctors<\u002Fcode> mobile 375<\u002Fdiv>\n      <div style=\"display:flex;gap:24px;align-items:flex-start\">\n        <div style=\"width:660px;background:#fff;border:1px solid rgba(22,34,44,.1);border-radius:8px;padding:32px 32px 34px\">\n          <div style=\"font:700 10.5px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9;margin:0 0 10px\">Nota de dirección<\u002Fdiv>\n          <h2 style=\"margin:0 0 14px;font:700 26px/1.2 'Plus Jakarta Sans';letter-spacing:-.015em;color:#16222c\">El margen de ficha<\u002Fh2>\n          <p style=\"margin:0 0 14px;font:400 15px/1.65 'Plus Jakarta Sans';color:#384857\">Todo bloque de contenido de la app se divide en dos columnas separadas por una línea de 1px: un <strong style=\"font-weight:600\">margen angosto<\u002Fstrong> a la izquierda que sólo lleva metadatos (kicker, numeración, avatar, punto de estado) y el <strong style=\"font-weight:600\">cuerpo<\u002Fstrong> a la derecha, que lleva la sustancia.<\u002Fp>\n          <p style=\"margin:0 0 14px;font:400 15px/1.65 'Plus Jakarta Sans';color:#384857\">Viene de la ficha clínica: el margen anotado de una historia médica. Resuelve tres cosas al mismo tiempo — le da a la app una asimetría reconocible, saca los metadatos de la jerarquía tipográfica (dejan de competir con los títulos) y crea una columna de alineación vertical que atraviesa todas las pantallas.<\u002Fp>\n          <div style=\"background:#eaeff5;border-radius:10px;padding:16px 18px;margin:0 0 18px\">\n            <div style=\"font:700 10.5px/1 'Plus Jakarta Sans';letter-spacing:.11em;text-transform:uppercase;color:#8496a9;margin:0 0 10px\">Cómo sostenerlo<\u002Fdiv>\n            <div style=\"font:400 13.5px/1.85 'Plus Jakarta Sans';color:#384857\">\n              Página: margen de <strong style=\"font-weight:600\">96px<\u002Fstrong>, kicker alineado a la derecha contra la regla.<br>\n              Card: margen de <strong style=\"font-weight:600\">64px<\u002Fstrong>, avatar centrado, estado debajo.<br>\n              Fila de lista: margen de <strong style=\"font-weight:600\">56px<\u002Fstrong>, sólo fecha o inicial.<br>\n              Mobile: el margen colapsa a <strong style=\"font-weight:600\">44px<\u002Fstrong>; nunca desaparece.<br>\n              La regla es siempre <strong style=\"font-weight:600\">1px #dfe6ee<\u002Fstrong>, nunca de color.\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 13.5px/1.6 'Plus Jakarta Sans';color:#647587\">Descartado a propósito: el acento lateral de color (satura y compite con el rol de acción del azul) y la ilustración como textura de fondo (la firma de cintas rinde como pieza, no como trama).<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"width:375px;background:#f4f7fa;border:1px s Jakarta Sans';color:#16222c\">4,5<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font:400 12px/1.4 'Plus Jakarta Sans';color:#647587;margin:0 0 8px\">Rawson 2100 · <span style=\"font-weight:600;color:#384857\">2,8 km<\u002Fspan><\u002Fdiv>\n                    <p style=\"margin:0 0 9px;font:400 12.5px/1.5 'Plus Jakarta Sans';color:#647587\">Acompañamiento centrado en el crecimiento personal y el autoconocimiento.<\u002Fp>\n                    <div style=\"display:flex;align-items:center;gap:6px;font:600 12px/1 'Plus Jakarta Sans';color:#8496a9\"><span style=\"width:6px;height:6px;border-radius:999px;background:#cbd6e2\"><\u002Fspan>Sin turnos disponibles<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border-top:1px solid #eaeff5;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;background:#fafcfd\">\n                  <button style=\"height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#384857;font:600 12.5px 'Plus Jakarta Sans'\">Ver reseñas<\u002Fbutton>\n                  <button style=\"height:34px;padding:0 14px;border:1px solid #cbd6e2;border-radius:8px;background:#fff;color:#253340;font:600 12.5px 'Plus Jakarta Sans'\">Ver perfil<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <p style=\"margin:26px 0 0;font:400 12px/1.5 'Plus Jakarta Sans';color:rgba(22,34,44,.5)\">Seguimos con: “dale, hacé <code style=\"font:600 11px ui-monospace,Menlo,monospace\">/doctor/:id<\u002Fcode> con el flujo de reserva” · “probá el margen de ficha más ancho en las cards” · “mostrame <code style=\"font:600 11px ui-monospace,Menlo,monospace\">/reviews<\u002Fcode> y <code style=\"font:600 11px ui-monospace,Menlo,monospace\">/appointments<\u002Fcode>”<\u002Fp>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;estadoLista&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;resultados&quot;,&quot;vacio&quot;,&quot;cargando&quot;],&quot;default&quot;:&quot;resultados&quot;,&quot;tsType&quot;:&quot;'resultados'|'vacio'|'cargando'&quot;,&quot;section&quot;:&quot;/doctors&quot;},&quot;densidad&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;trabajo&quot;,&quot;comoda&quot;],&quot;default&quot;:&quot;trabajo&quot;,&quot;tsType&quot;:&quot;'trabajo'|'comoda'&quot;,&quot;section&quot;:&quot;/doctors&quot;},&quot;margenFicha&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;/doctors&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const estado = this.props.estadoLista ?? 'resultados';\n    const densidad = this.props.densidad ?? 'trabajo';\n    const margen = this.props.margenFicha ?? true;\n    const rail = margen ? '#eaeff5' : 'transparent';\n    const pad = densidad === 'trabajo' ? '16px' : '24px';\n    const stars = (n) => '★★★★★'.slice(0, n) + '';\n    const base = [\n      { iniciales: 'NR', nombre: 'Nicolas Rodriguez', especialidad: 'Terapia familiar', rating: '4,8', llenas: 5,\n        direccion: 'Juncal 3130 ·', distancia: '1,6 km',\n        descripcion: 'Intervención terapéutica para fortalecer vínculos y dinámicas familiares.',\n        disponibilidad: '3 turnos esta semana', dias: ['Lunes', 'Miércoles'], libre: true },\n      { iniciales: 'JH', nombre: 'Julieta Herrera', especialidad: 'Terapia humanista', rating: '4,5', llenas: 4,\n        direccion: 'Rawson 2100 ·', distancia: '2,8 km',\n        descripcion: 'Acompañamiento centrado en el crecimiento personal y el autoconocimiento.',\n        disponibilidad: 'Sin turnos disponibles', dias: [], libre: false },\n      { iniciales: 'SM', nombre: 'Sofia Martinez', especialidad: 'Psiquiatría', rating: '4,9', llenas: 5,\n        direccion: 'Olavarría 2502 ·', distancia: '3,6 km',\n        descripcion: 'Diagnóstico y tratamiento médico de trastornos mentales, con enfoque integral.',\n        disponibilidad: '5 turnos esta semana', dias: ['Lunes', 'Jueves', 'Viernes'], libre: true },\n      { iniciales: 'LF', nombre: 'Lucas Fernandez', especialidad: 'Sexología', rating: '4,4', llenas: 4,\n        direccion: 'Güemes 2500 ·', distancia: '3,7 km',\n        descripcion: 'Abordaje terapéutico de la sexualidad, vínculos y bienestar íntimo.',\n        disponibilidad: '2 turnos esta semana', dias: ['Lunes', 'Martes'], libre: true },\n      { iniciales: 'MG', nombre: 'Maria Gonzales', especialidad: 'Psicología laboral', rating: '4,7', llenas: 5,\n        direccion: 'Av. Constitución 5200 ·', distancia: '5,0 km',\n        descripcion: 'Orientación en estrés laboral, clima organizacional y desarrollo profesional.',\n        disponibilidad: '4 turnos esta semana', dias: ['Miércoles', 'Viernes'], libre: true }\n    ];\n    const doctors = base.map((d) => ({\n      ...d,\n      rail,\n      pad,\n      estrellas: stars(d.llenas),\n      avBg: d.libre ? '#dceaf4' : '#eaeff5',\n      avFg: d.libre ? '#094c74' : '#8496a9',\n      dot: d.libre ? '#15b096' : '#cbd6e2',\n      dispColor: d.libre ? '#0b6f5f' : '#8496a9',\n      cta: d.libre ? 'Reservar turno' : 'Ver perfil',\n      ctaBg: d.libre ? '#0b5d8e' : '#ffffff',\n      ctaFg: d.libre ? '#ffffff' : '#253340',\n      ctaBorder: d.libre ? '0' : '1px solid #cbd6e2',\n      dias: d.dias.length ? d.dias : ['Agenda cerrada']\n    }));\n    const calDays = [];\n    calDays.push({ n: '', bg: 'transparent', fg: 'transparent', dot: 'transparent', font: '400' });\n    for (let n = 1; n <= 30; n++) {\n      const wd = n % 7; // 0=Lu … Sept 1 2026 = martes (día 7 = lunes)\n      const atiende = wd === 0 || wd === 2 || wd === 4;\n      const futuro = n >= 10;\n      const sel = n === 16;\n      const libre = atiende && futuro && !sel;\n      calDays.push({\n        n: String(n),\n        bg: sel ? '#0b5d8e' : (libre ? '#f4f7fa' : 'transparent'),\n        fg: sel ? '#ffffff' : (futuro ? '#253340' : '#c3cedb'),\n        dot: sel ? 'rgba(255,255,255,.7)' : (libre ? '#15b096' : 'transparent'),\n        font: sel || libre ? '600' : '400'\n      });\n    }\n    const slot = (hora, estado) => ({\n      hora,\n      bg: estado === 'sel' ? '#0b5d8e' : (estado === 'off' ? '#f4f7fa' : '#ffffff'),\n      fg: estado === 'sel' ? '#ffffff' : (estado === 'off' ? '#b3c0cf' : '#253340'),\n      border: estado === 'sel' ? '1px solid #0b5d8e' : (estado === 'off' ? '1px solid #eaeff5' : '1px solid #d2dbe5'),\n      weight: estado === 'sel' ? '700' : '500',\n      deco: estado === 'off' ? 'line-through' : 'none'\n    });\n    const slots = [\n      slot('08:00', 'on'), slot('09:00', 'on'), slot('10:00', 'off'), slot('11:00', 'sel'),\n      slot('12:00', 'on'), slot('13:00', 'off'), slot('16:00', 'on'), slot('17:00', 'on')\n    ];\n    const estados = {\n      pendiente: { estado: 'Pendiente', estadoBg: '#eff6fb', estadoFg: '#094c74' },\n      completado: { estado: 'Completado', estadoBg: '#eafaf6', estadoFg: '#0b6f5f' },\n      cancelado: { estado: 'Cancelado', estadoBg: '#fdf2f1', estadoFg: '#a93830' }\n    };\n    const misTurnos = [\n      { dia: '16', mes: 'Sep', hora: '11:00', iniciales: 'NR', nombre: 'Nicolas Rodriguez', especialidad: 'Terapia familiar', modalidad: 'Presencial · Juncal 3130', ...estados.pendiente, accion: 'Ver detalle', cta: 'Cancelar', ctaBorde: '#f5bdb8', ctaFg: '#a93830' },\n      { dia: '23', mes: 'Sep', hora: '09:00', iniciales: 'SM', nombre: 'Sofia Martinez', especialidad: 'Psiquiatría', modalidad: 'Videollamada', ...estados.pendiente, accion: 'Ver detalle', cta: 'Cancelar', ctaBorde: '#f5bdb8', ctaFg: '#a93830' },\n      { dia: '02', mes: 'Sep', hora: '10:00', iniciales: 'MG', nombre: 'Maria Gonzales', especialidad: 'Psicología laboral', modalidad: 'Presencial · Av. Constitución 5200', ...estados.completado, accion: 'Ver detalle', cta: 'Dejar reseña', ctaBorde: '#cbd6e2', ctaFg: '#253340' }\n    ].map((t, i) => ({ ...t, sep: i === 0 ? '0' : '1px solid #eaeff5', diaColor: t.estado === 'Completado' ? '#8496a9' : '#16222c' }));\n    const misPacientes = [\n      { dia: '17', mes: 'Sep', hora: '08:00', iniciales: 'JP', nombre: 'Juan Perez', modalidad: 'Presencial · consultorio', ...estados.pendiente },\n      { dia: '18', mes: 'Sep', hora: '12:00', iniciales: 'VL', nombre: 'Valentina Lopez', modalidad: 'Videollamada', ...estados.pendiente }\n    ].map((p, i) => ({ ...p, sep: i === 0 ? '0' : '1px solid #eaeff5', diaColor: '#16222c' }));\n    const resenas = [\n      { iniciales: 'MS', nombre: 'Martin Sanchez', fecha: '2 feb 2026', llenas: 5, texto: 'Sesión muy productiva. Ordenó una conversación que veníamos teniendo mal en casa desde hace años, y salimos con algo concreto para practicar.' },\n      { iniciales: 'VL', nombre: 'Valentina Lopez', fecha: '2 mar 2026', llenas: 4, texto: 'Escucha activa y buen feedback. Puntual con los horarios, algo que valoro mucho cuando uno organiza el día alrededor de la sesión.' },\n      { iniciales: 'JP', nombre: 'Juan Perez', fecha: '9 feb 2026', llenas: 5, texto: 'Me sentí cómodo desde la primera consulta. No fuerza el ritmo ni empuja conclusiones.' },\n      { iniciales: 'CR', nombre: 'Camila Romero', fecha: '4 feb 2026', llenas: 4, texto: 'Muy claro en su enfoque. Explicó de entrada cómo iba a trabajar y eso me bajó bastante la ansiedad inicial.' }\n    ].map((r) => ({ ...r, estrellas: stars(r.llenas) }));\n    return {\n      doctors,\n      pad,\n      resenas,\n      calDays,\n      slots,\n      misTurnos,\n      misPacientes,\n      showResults: estado === 'resultados',\n      showEmpty: estado === 'vacio',\n      showLoading: estado === 'cargando',\n      skeletons: [\n        { a: '62%', b: '44%', c: '70%' },\n        { a: '54%', b: '50%', c: '62%' },\n        { a: '68%', b: '40%', c: '58%' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
