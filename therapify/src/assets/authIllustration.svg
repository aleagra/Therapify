<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="100%" height="100%" fill="none" aria-hidden="true">
  <defs>
    <!-- Paleta vertical serena para panel oscuro #083c5c -->
    <linearGradient id="auth-ribbon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5cb0df" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1e8fd0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b5d8e" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="auth-ribbon-teal" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42c8b2" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#15b096" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a7a67" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="auth-loop-soft" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e8fd0" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="auth-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#041826" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Bucle suave de fondo -->
  <path d="M 90 60
           C 250 80, 290 200, 180 260
           C 80 310, 120 370, 220 380"
        stroke="url(#auth-loop-soft)"
        stroke-width="18"
        stroke-linecap="round"
        fill="none" />

  <!-- Cinta Teal vertical principal -->
  <path d="M 110 50
           C 240 110, 260 210, 170 270
           C 90 320, 110 370, 180 390"
        stroke="url(#auth-ribbon-teal)"
        stroke-width="12"
        stroke-linecap="round"
        filter="url(#auth-glow)"
        fill="none" />

  <!-- Cinta Azul entrelazada vertical -->
  <path d="M 210 40
           C 120 120, 100 230, 200 290
           C 280 340, 240 380, 190 400"
        stroke="url(#auth-ribbon-blue)"
        stroke-width="10"
        stroke-linecap="round"
        filter="url(#auth-glow)"
        fill="none" />

  <!-- Detalle sutil de nodo / sinapsis -->
  <circle cx="170" cy="270" r="4" fill="#2dd4bf" />
  <circle cx="200" cy="290" r="3" fill="#5cb0df" />
</svg>
