<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="grad-blue-mid" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="grad-blue-bot" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="grad-teal-top" x1="30%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <linearGradient id="grad-teal-mid" x1="0%" y1="30%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="grad-teal-bot" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="60%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="grad-branch-left" x1="100%" y1="20%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- Soft Depth Shadow Filter -->
    <filter id="shadow-deep" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>

    <filter id="shadow-mid" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    
    <filter id="shadow-soft" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Graphic -->
  <circle cx="340" cy="350" r="220" fill="#f0fdfa" filter="blur(50px)" opacity="0.8"/>
  <circle cx="260" cy="300" r="180" fill="#eff6ff" filter="blur(45px)" opacity="0.9"/>

  <!-- ================= LAYER 1: BACK SEGMENTS ================= -->
  <g class="layer-back" filter="url(#shadow-soft)">
    <!-- Teal Top Loop Behind -->
    <path d="M 370 70 
             C 410 70, 480 110, 490 190 
             C 498 250, 460 300, 420 330 
             C 400 345, 380 355, 360 360
             C 385 345, 415 320, 425 280
             C 435 230, 430 145, 360 130
             Z" 
          fill="url(#grad-teal-top)" opacity="0.92"/>

    <!-- Blue Lower Loop Going Under -->
    <path d="M 340 430
             C 310 490, 310 560, 360 630
             C 385 665, 410 685, 430 700
             L 370 700
             C 340 670, 270 590, 280 500
             C 285 450, 315 410, 340 380
             Z" 
          fill="url(#grad-blue-bot)" opacity="0.95"/>
  </g>

  <!-- ================= LAYER 2: MIDDLE WEAVE SEGMENTS ================= -->
  <g class="layer-mid">
    <!-- Teal Crossing Loop Under Branch -->
    <path d="M 450 250
             C 485 300, 495 380, 450 440
             C 410 490, 335 520, 305 570
             C 275 620, 280 670, 300 700
             L 245 700
             C 225 650, 230 590, 260 535
             C 290 480, 360 450, 395 405
             C 430 365, 425 305, 395 265
             Z"
          fill="url(#grad-teal-mid)" filter="url(#shadow-mid)"/>

    <!-- Blue Central Spine / Downward Flow -->
    <path d="M 320 60
             C 360 60, 400 110, 400 180
             C 400 240, 360 290, 330 340
             C 300 390, 280 440, 300 500
             C 315 545, 345 590, 385 640
             C 355 600, 330 555, 320 520
             C 305 470, 325 420, 355 370
             C 385 320, 430 260, 420 180
             C 415 120, 370 80, 320 60
             Z" 
          fill="url(#grad-blue-top)" filter="url(#shadow-soft)"/>
  </g>

  <!-- ================= LAYER 3: FOREGROUND WEAVE & LEFT BRANCH ================= -->
  <g class="layer-front" filter="url(#shadow-deep)">
    <!-- Teal Upper Spiral Arc -->
    <path d="M 330 110
             C 300 160, 305 230, 350 280
             C 390 325, 440 340, 460 390
             C 480 440, 460 500, 410 545
             C 445 495, 455 450, 440 420
             C 425 385, 380 370, 340 330
             C 290 280, 280 200, 310 140
             Z"
          fill="url(#grad-teal-top)"/>

    <!-- Prominent Branch Ribbon Curving Out To The Left (with ribbon tail) -->
    <!-- Starts from center, arches smoothly over and down to the left, terminating with swallowtail fold -->
    <path d="M 360 290
             C 330 265, 270 260, 200 290
             C 145 315, 110 365, 80 430
             L 115 440
             L 125 405
             L 138 432
             C 160 380, 195 345, 240 325
             C 290 305, 335 305, 375 325
             Z"
          fill="url(#grad-branch-left)" filter="url(#shadow-mid)"/>

    <!-- Foreground Overlapping Loop (Blue-Teal Helix Knot) -->
    <path d="M 375 325
             C 410 345, 435 380, 440 420
             C 445 460, 425 500, 385 540
             C 345 580, 330 630, 340 680
             C 315 640, 325 590, 360 550
             C 395 510, 415 480, 410 445
             C 405 415, 385 390, 355 370
             C 340 350, 350 335, 375 325
             Z"
          fill="url(#grad-teal-bot)"/>

    <!-- Vibrant Central Fore-Ribbon Twisting Through -->
    <path d="M 345 220
             C 380 260, 395 310, 375 360
             C 355 410, 310 450, 290 500
             C 270 550, 280 610, 320 670
             L 295 670
             C 260 610, 250 550, 270 495
             C 290 440, 335 400, 355 350
             C 370 310, 360 270, 330 230
             Z"
          fill="url(#grad-blue-mid)" filter="url(#shadow-soft)"/>
  </g>

  <!-- Elegant Highlight Accents (Glassy Sheen on Upper Ribbons) -->
  <path d="M 330 115
           C 305 160, 310 220, 348 265
           C 344 260, 315 210, 332 125
           Z"
        fill="#ffffff" opacity="0.35"/>

  <path d="M 330 275
           C 270 275, 210 305, 155 345
           C 205 315, 265 285, 325 285
           Z"
        fill="#ffffff" opacity="0.45"/>
</svg>
