<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none" aria-hidden="true">
  <defs>
    <!-- Paleta de azules institucionales y teales médicos -->
    <linearGradient id="ab-grad-blue-main" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#5cb0df"/>
      <stop offset="45%" stop-color="#1e8fd0"/>
      <stop offset="85%" stop-color="#0d76b3"/>
      <stop offset="100%" stop-color="#0b5d8e"/>
    </linearGradient>

    <linearGradient id="ab-grad-blue-deep" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#0d76b3"/>
      <stop offset="60%" stop-color="#094b72"/>
      <stop offset="100%" stop-color="#083b58"/>
    </linearGradient>

    <linearGradient id="ab-grad-teal-main" x1="100%" y1="30%" x2="0%" y2="70%">
      <stop offset="0%" stop-color="#42c8b2"/>
      <stop offset="40%" stop-color="#15b096"/>
      <stop offset="80%" stop-color="#10a38b"/>
      <stop offset="100%" stop-color="#0a7a67"/>
    </linearGradient>

    <linearGradient id="ab-grad-teal-deep" x1="90%" y1="10%" x2="10%" y2="90%">
      <stop offset="0%" stop-color="#10a38b"/>
      <stop offset="65%" stop-color="#0d8f79"/>
      <stop offset="100%" stop-color="#075b4d"/>
    </linearGradient>

    <linearGradient id="ab-grad-converge" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e8fd0"/>
      <stop offset="48%" stop-color="#0b5d8e"/>
      <stop offset="52%" stop-color="#0a7a67"/>
      <stop offset="100%" stop-color="#15b096"/>
    </linearGradient>

    <linearGradient id="ab-grad-soft-loop" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#42c8b2" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#1e8fd0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d76b3" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="ab-shadow-deep" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d1a24" flood-opacity="0.10"/>
    </filter>
    <filter id="ab-shadow-mid" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0d1a24" flood-opacity="0.08"/>
    </filter>
    <filter id="ab-shadow-soft" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0d1a24" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Capa de fondo: Bucles suaves y horizontales que marcan el espacio de encuentro -->
  <g class="ab-bg-flow" filter="url(#ab-shadow-soft)">
    <!-- Flujo horizontal superior convergente -->
    <path d="M 60 190
             C 180 130, 290 140, 400 210
             C 510 280, 620 280, 740 210
             C 690 280, 560 330, 420 280
             C 290 230, 170 250, 60 190 Z"
          fill="url(#ab-grad-soft-loop)"
          opacity="0.35" />

    <!-- Trazo inferior de apoyo horizontal -->
    <path d="M 90 310
             C 220 370, 340 350, 430 300
             C 520 250, 630 250, 710 320
             C 610 390, 480 390, 390 350
             C 290 300, 190 320, 90 310 Z"
          fill="url(#ab-grad-blue-deep)"
          opacity="0.25" />
  </g>

  <!-- Capa media: Cintas que entran desde los laterales y se encuentran en el centro -->
  <g class="ab-mid-flow" filter="url(#ab-shadow-mid)">
    <!-- Cinta izquierda (azul médico): avanza desde la izquierda hacia el nodo central -->
    <path d="M 40 250
             C 120 180, 240 180, 330 230
             C 380 260, 420 270, 460 250
             C 490 235, 520 200, 550 170
             C 510 180, 460 210, 430 220
             C 380 235, 340 220, 290 190
             C 210 140, 110 170, 40 250 Z"
          fill="url(#ab-grad-blue-main)" />

    <!-- Cinta derecha (teal): entra desde la derecha y converge hacia el mismo centro -->
    <path d="M 760 240
             C 680 180, 570 190, 490 235
             C 440 265, 400 270, 360 250
             C 330 235, 300 200, 260 170
             C 300 180, 350 210, 380 220
             C 430 235, 470 220, 520 190
             C 600 140, 700 170, 760 240 Z"
          fill="url(#ab-grad-teal-main)" />
  </g>

  <!-- Capa frontal: La cinta de unión y alianza horizontal que cruza y entrelaza ambos extremos -->
  <g class="ab-front-flow" filter="url(#ab-shadow-deep)">
    <!-- Gran cinta envolvente horizontal que une ambos horizontes -->
    <path d="M 80 230
             C 180 320, 290 340, 380 290
             C 430 260, 470 260, 520 290
             C 610 340, 710 310, 730 230
             C 680 300, 590 320, 510 275
             C 460 245, 430 245, 390 275
             C 310 320, 200 290, 80 230 Z"
          fill="url(#ab-grad-converge)" />

    <!-- Doble cinta central de resonancia (acento teal suave que abraza el punto de encuentro) -->
    <path d="M 280 270
             C 330 310, 390 320, 430 290
             C 465 265, 500 265, 530 285
             C 500 300, 455 300, 420 280
             C 380 260, 335 255, 280 270 Z"
          fill="url(#ab-grad-teal-deep)" />

    <!-- Trazo fino superior de balance y luz -->
    <path d="M 230 180
             C 310 140, 400 160, 460 195
             C 520 230, 580 210, 620 170
             C 560 200, 500 210, 450 185
             C 380 150, 300 145, 230 180 Z"
          fill="url(#ab-grad-blue-deep)"
          opacity="0.8" />
  </g>

  <!-- Puntos sutiles de equilibrio armónico (sin rostros ni corazones) -->
  <circle cx="395" cy="275" r="5" fill="#15b096" opacity="0.9" />
  <circle cx="435" cy="255" r="4.5" fill="#1e8fd0" opacity="0.9" />
  <circle cx="415" cy="265" r="3" fill="#ffffff" opacity="0.8" />
</svg>
