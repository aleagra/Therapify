<h1>Psicologos disponibles</h1>
<input
  type="text"
  placeholder="Buscar por nombre, apellido o especialidad..."
  [ngModel]="searchText()"
  (ngModelChange)="searchText.set($event)"
  class="search-input"
/>

<div class="day-filter-container">
  <h2>Filtrar por día:</h2>
  <div class="day-filters">
    <button
      *ngFor="let day of DAYS_OF_WEEK"
      class="day-btn"
      [class.active-day]="selectedDay() === day"
      (click)="setDay(day)"
    >
      {{ DAY_LABELS[day] }}
    </button>
  </div>
</div>

<div class="doctores-container">
  @for (doctor of filteredDoctors(); track doctor.id) {
    <app-doctor-card
      [doctor]="doctor"
      (navigate)="goToDetail($event)"
    ></app-doctor-card>
  }
</div>
