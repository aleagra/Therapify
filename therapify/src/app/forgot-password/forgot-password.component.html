<div class="auth-page-wrapper">
  <div class="auth-card card">
    <div class="auth-header">
      <img src="/assets/logo.png" alt="Therapify" class="auth-logo" />
      <h1 class="auth-title">Recuperar contraseña</h1>
      <p class="auth-subtitle">
        Ingresá tu correo electrónico y te enviaremos un enlace para restablecerla
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-field">
        <label for="email" class="field-label">Correo electrónico</label>
        <input
          id="email"
          type="email"
          placeholder="ejemplo@correo.com"
          formControlName="email"
        />
      </div>

      <button type="submit" class="btn-primary auth-submit-btn" [disabled]="loading">
        {{ loading ? "Enviando..." : "Enviar enlace de recuperación" }}
      </button>

      @if (success) {
        <div class="success-alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Si el correo existe, recibirás un enlace para cambiar tu contraseña.</span>
        </div>
      }

      <p class="switch-auth-text">
        <a routerLink="/login">← Volver a iniciar sesión</a>
      </p>
    </form>
  </div>
</div>
