<div class="auth-flow-page">
  <div class="auth-flow-container">
    <header class="header-block rail-layout-96">
      <div class="header-rail">
        <span class="rail-kicker">Acceso</span>
        <span class="rail-number">01</span>
      </div>
      <div class="header-body">
        <h1 class="page-title">Recuperar contraseña</h1>
        <p class="page-subtitle">Ingresá tu correo electrónico para recibir un enlace de recuperación seguro.</p>
      </div>
    </header>

    <div class="auth-flow-layout rail-layout-96">
      <div class="content-rail-empty"></div>
      <div class="content-body-wrap">
        <div class="auth-flow-card surface-card">
          <form [formGroup]="form" (ngSubmit)="submit()" class="auth-flow-form">
            <div class="form-field">
              <label for="email" class="field-label">Correo electrónico</label>
              <input
                id="email"
                type="email"
                placeholder="ejemplo@correo.com"
                formControlName="email"
                class="flow-input"
              />
            </div>

            <button type="submit" class="btn-flow-submit" [disabled]="loading">
              {{ loading ? "Enviando..." : "Enviar enlace de recuperación" }}
            </button>

            @if (success) {
              <div class="success-alert-banner">
                <div class="alert-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f6e56" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </div>
                <span>Si el correo ingresado coincide con una cuenta activa, recibirás las instrucciones en tu casilla en unos instantes.</span>
              </div>
            }

            <p class="switch-auth-text">
              <a routerLink="/login" class="link-bold">&larr; Volver a iniciar sesión</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
