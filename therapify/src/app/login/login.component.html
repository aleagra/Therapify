<div class="auth-page-wrapper">
  <div class="auth-card card">
    <div class="auth-header">
      <img src="/assets/logo.png" alt="Therapify" class="auth-logo" />
      <h1 class="auth-title">Bienvenido de nuevo</h1>
      <p class="auth-subtitle">
        Ingresá a tu cuenta para gestionar tus consultas y turnos
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-field">
        <label for="email" class="field-label">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="ejemplo@correo.com"
          [class.invalid]="getControl('email').invalid && getControl('email').touched"
        />
        <small
          class="error-msg"
          [class.visible]="getControl('email').invalid && getControl('email').touched"
        >
          Ingresá una dirección de correo válida.
        </small>
      </div>

      <div class="form-field">
        <label for="password" class="field-label">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          [class.invalid]="getControl('password').invalid && getControl('password').touched"
        />
        <small
          class="error-msg"
          [class.visible]="getControl('password').invalid && getControl('password').touched"
        >
          Es necesario ingresar tu contraseña.
        </small>
      </div>

      <div class="forgot-row">
        <a routerLink="/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-primary auth-submit-btn" [disabled]="loading">
        {{ loading ? "Ingresando..." : "Iniciar sesión" }}
      </button>

      <p class="switch-auth-text">
        ¿No tenés una cuenta?
        <a routerLink="/register">Registrate acá</a>
      </p>
    </form>
  </div>
</div>
