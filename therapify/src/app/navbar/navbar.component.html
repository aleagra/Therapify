<header class="header-root">
  <div class="header-container">
    <!-- Brand Logo -->
    <a routerLink="/home" class="brand-logo" aria-label="Therapify Inicio">
      <div class="brand-mark"></div>
      <span class="brand-text">Therapify</span>
    </a>

    <!-- Botón Hamburguesa Mobile -->
    <button
      class="mobile-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Menú de navegación"
    >
      <span class="hamburger-bar" [class.open-bar-1]="menuOpen"></span>
      <span class="hamburger-bar" [class.open-bar-2]="menuOpen"></span>
    </button>

    <!-- Navegación Desktop & Menú Mobile -->
    <nav class="nav-wrapper" [class.is-open]="menuOpen">
      <div class="nav-links">
        <a
          routerLink="/doctors"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="menuOpen = false"
          class="nav-item"
        >
          Buscar profesionales
        </a>
        <a
          routerLink="/appointments"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="menuOpen = false"
          class="nav-item"
        >
          Mis turnos
        </a>
        <a
          routerLink="/about-us"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="menuOpen = false"
          class="nav-item"
        >
          Sobre nosotros
        </a>
        <a
          *ngIf="userService.getLoggedUser()?.userType === 'ADMIN'"
          routerLink="/users"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="menuOpen = false"
          class="nav-item"
        >
          Usuarios
        </a>
        <a
          *ngIf="userService.isLoggedSignal()"
          routerLink="/profile"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="menuOpen = false"
          class="nav-item"
        >
          Mi perfil
        </a>
      </div>

      <div class="nav-separator" aria-hidden="true"></div>

      <div class="nav-actions">
        <button
          type="button"
          class="auth-button"
          (click)="handleLoginLogout()"
        >
          {{ userService.isLoggedSignal() ? 'Cerrar sesión' : 'Iniciar sesión' }}
        </button>
      </div>
    </nav>
  </div>
</header>
