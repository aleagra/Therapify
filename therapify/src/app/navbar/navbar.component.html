<nav class="navbar">
  <div class="logo" routerLink="/home">
    <img src="/assets/logo.png" alt="Therapify Logo" />
    <span class="brand-name">Therapify</span>
  </div>

  <button class="menu-toggle" (click)="toggleMenu()" aria-label="Abrir menú de navegación">
    <svg *ngIf="!menuOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
    <svg *ngIf="menuOpen" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

  <ul [class.active]="menuOpen" class="nav-links">
    <li>
      <a
        routerLink="/doctors"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="menuOpen = false"
      >
        Buscar profesionales
      </a>
    </li>
    <li>
      <a
        routerLink="/appointments"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="menuOpen = false"
      >
        Mis turnos
      </a>
    </li>
    <li>
      <a
        routerLink="/about-us"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="menuOpen = false"
      >
        Sobre nosotros
      </a>
    </li>
    <li *ngIf="userService.getLoggedUser()?.userType === 'ADMIN'">
      <a
        routerLink="/users"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="menuOpen = false"
      >
        Usuarios
      </a>
    </li>
    <li *ngIf="userService.isLoggedSignal()">
      <a
        routerLink="/profile"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="menuOpen = false"
      >
        Mi perfil
      </a>
    </li>

    <li class="nav-divider" aria-hidden="true"></li>

    <li class="auth-action">
      <button
        class="login-btn"
        [class.logout-btn]="userService.isLoggedSignal()"
        (click)="handleLoginLogout()"
      >
        <svg *ngIf="userService.isLoggedSignal()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <svg *ngIf="!userService.isLoggedSignal()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        {{ userService.isLoggedSignal() ? "Cerrar sesión" : "Iniciar sesión" }}
      </button>
    </li>
  </ul>
</nav>
