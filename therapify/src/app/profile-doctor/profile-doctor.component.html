<div class="profile-grid">
  <form
    class="medical-form"
    [formGroup]="formSchedule"
    (ngSubmit)="onSubmitMedical()"
  >
    <div *ngIf="doctorWithoutAddress" class="address-warning">
      ⚠️ Para que tu perfil se recomiende es necesario que ingreses tu
      dirección.
    </div>

    <div class="profile-header">
      <h2>Horario Medico</h2>
      <p>Selecciona tus días disponibles y agrega una breve descripción</p>
    </div>

    <div class="days-group">
      <div class="day-row" *ngFor="let day of weekDays">
        <label class="day-checkbox">
          <input type="checkbox" [formControlName]="day.control" />
          {{ day.label }}
        </label>

        <div
          class="hours-container"
          *ngIf="formSchedule.get(day.control)?.value"
        >
          <input
            type="time"
            [formControlName]="day.control + 'Start'"
            class="hour-input"
          />
          <span> - </span>
          <input
            type="time"
            [formControlName]="day.control + 'End'"
            class="hour-input"
          />
        </div>
      </div>
    </div>

    <div class="input-field full">
      <label for="description">Descripcion</label>
      <textarea
        id="description"
        rows="6"
        placeholder="Describe tus especialidades..."
        formControlName="description"
      ></textarea>
    </div>

    <div class="action-buttons">
      <button type="button" class="btn-secondary" (click)="cancelMedical()">
        Cancelar
      </button>
      <button type="submit" class="btn-primary">Guardar cambios</button>
    </div>
  </form>
</div>
