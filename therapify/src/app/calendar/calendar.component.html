<form
  class="agendar-container"
  [formGroup]="citaForm"
  (ngSubmit)="confirmarReserva()"
>
  <div class="selector-columna">
    <h2>Agendar Sesión</h2>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha de la Cita</mat-label>

      <input
        matInput
        [matDatepicker]="picker"
        formControlName="fecha"
        [min]="minDate"
        [matDatepickerFilter]="filtroDeDias"
        (dateChange)="onFechaSeleccionada($event.value)"
      />

      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <div class="horario-selector">
      <label class="horario-label">Horarios Disponibles</label>

      <mat-button-toggle-group formControlName="hora" class="horarios-grid">
        <mat-button-toggle
          *ngFor="let hora of horariosDisponibles"
          [value]="hora"
        >
          {{ hora }}
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>
  </div>

  <div class="resumen-columna">
    <mat-card class="detalle-cita">
      <mat-card-title>Resumen de la Reserva</mat-card-title>

      <mat-card-content>
        <p>
          Fecha:
          <strong>{{
            citaForm.get("fecha")?.value | date : "mediumDate"
          }}</strong>
        </p>
        <p>
          Hora: <strong>{{ citaForm.get("hora")?.value }}</strong>
        </p>
        <p>Modalidad: <strong>Videollamada</strong></p>

        <mat-divider></mat-divider>

        <div class="costo-total">
          <p>Costo Total:</p>
          <p class="precio"><strong>$75 USD</strong></p>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button
          mat-raised-button
          class="full-width confirmar-btn"
          type="submit"
          [disabled]="citaForm.invalid || reservaConfirmada"
          [ngClass]="{ confirmado: reservaConfirmada }"
        >
          <ng-container *ngIf="!reservaConfirmada">
            Confirmar Reserva
          </ng-container>

          <ng-container *ngIf="reservaConfirmada">
            ✔ Reserva Confirmada
          </ng-container>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</form>
