<div class="profile-container">
  <!-- PERFIL -->
  <div class="profile-grid">
    <form
      class="profile-form"
      [formGroup]="formProfile"
      (ngSubmit)="onSubmitProfile()"
    >
      <div class="profile-header">
        <h2>Profile Information</h2>
        <p>View and edit your personal details below</p>
      </div>

      <div class="form-group double">
        <div class="input-field">
          <label for="firstName">First name</label>
          <input
            id="firstName"
            type="text"
            formControlName="firstName"
            required
          />
        </div>
        <div class="input-field">
          <label for="lastName">Last name</label>
          <input
            id="lastName"
            type="text"
            formControlName="lastName"
            required
          />
        </div>
      </div>

      <div class="form-group double">
        <div class="input-field">
          <label for="password">New password</label>
          <input id="password" type="password" formControlName="password" />
        </div>
        <div class="input-field">
          <label for="repeatPassword">Repeat password</label>
          <input
            id="repeatPassword"
            type="password"
            formControlName="repeatPassword"
          />
        </div>
      </div>

      <div class="form-group">
        <div class="input-field full">
          <label for="address">Address</label>
          <input id="address" type="text" formControlName="address" required />
        </div>
      </div>

      <div class="form-group gender-group">
        <label>Gender</label>
        <div class="gender-options">
          <label
            ><input type="radio" value="male" formControlName="gender" />
            Male</label
          >
          <label
            ><input type="radio" value="female" formControlName="gender" />
            Female</label
          >
          <label
            ><input type="radio" value="non-binary" formControlName="gender" />
            Non-binary</label
          >
        </div>
      </div>

      <div class="action-buttons">
        <button type="button" class="btn-secondary" (click)="cancel()">
          Cancel
        </button>
        <button type="submit" class="btn-primary">Save Changes</button>
      </div>
    </form>
  </div>

  <!-- HORARIOS MÉDICOS -->
  <div *ngIf="user.userType === 'doctor'" class="profile-grid">
    <form
      class="medical-form"
      [formGroup]="formSchedule"
      (ngSubmit)="onSubmitMedical()"
    >
      <div class="profile-header">
        <h3>Medical Schedule</h3>
        <p>Select your available days and provide a short description</p>
      </div>

      <div class="days-group">
        <div class="day-row" *ngFor="let day of weekDays">
          <label class="day-checkbox">
            <input type="checkbox" [formControlName]="day.control" />
            {{ day.label }}
          </label>

          <div
            class="hours-container"
            *ngIf="formSchedule.get(day.control)?.value"
          >
            <input
              type="time"
              [formControlName]="day.control + 'Start'"
              class="hour-input"
            />
            <span>to</span>
            <input
              type="time"
              [formControlName]="day.control + 'End'"
              class="hour-input"
            />
          </div>
        </div>
      </div>

      <div class="input-field full">
        <label for="description">Description</label>
        <textarea
          id="description"
          rows="9"
          placeholder="Describe your specialties..."
          formControlName="description"
        ></textarea>
      </div>

      <div class="action-buttons">
        <button type="button" class="btn-secondary" (click)="cancel()">
          Cancel
        </button>
        <button type="submit" class="btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>
